<svg width="1000" height="800" viewBox="0 0 1000 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#F4F4F5"/>

  <!-- Main Circle -->
  <circle cx="500" cy="400" r="300" fill="#F3140C" opacity="0.1"/>
  <circle cx="500" cy="400" r="250" fill="#F3140C" opacity="0.15"/>
  <circle cx="500" cy="400" r="200" fill="#F3140C" opacity="0.2"/>

  <!-- Laptop -->
  <rect x="250" y="320" width="500" height="320" rx="20" fill="#26262C"/>
  <rect x="270" y="340" width="460" height="260" fill="#FFFFFF"/>

  <!-- Laptop Screen Content -->
  <rect x="290" y="360" width="420" height="40" rx="8" fill="#F3140C" opacity="0.2"/>
  <rect x="290" y="420" width="200" height="20" rx="4" fill="#26262C" opacity="0.3"/>
  <rect x="290" y="460" width="280" height="20" rx="4" fill="#26262C" opacity="0.3"/>
  <rect x="290" y="500" width="240" height="20" rx="4" fill="#26262C" opacity="0.3"/>

  <!-- SEO Icon -->
  <circle cx="150" cy="250" r="60" fill="#FFFFFF"/>
  <circle cx="150" cy="250" r="50" fill="#F3140C" opacity="0.2"/>
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#F3140C">SEO</text>

  <!-- Rocket -->
  <g transform="translate(800, 150)">
    <path d="M50 0 L30 80 L50 70 L70 80 Z" fill="#F3140C"/>
    <ellipse cx="50" cy="25" rx="15" ry="20" fill="#FFFFFF"/>
    <path d="M30 80 L20 120 L30 100 Z" fill="#FF4D47"/>
    <path d="M70 80 L80 120 L70 100 Z" fill="#FF4D47"/>
  </g>

  <!-- Chart -->
  <g transform="translate(120, 500)">
    <rect x="0" y="80" width="40" height="80" fill="#F3140C" opacity="0.6"/>
    <rect x="50" y="50" width="40" height="110" fill="#F3140C" opacity="0.7"/>
    <rect x="100" y="20" width="40" height="140" fill="#F3140C" opacity="0.9"/>
    <path d="M20 90 L70 60 L120 30" stroke="#26262C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="90" r="8" fill="#26262C"/>
    <circle cx="70" cy="60" r="8" fill="#26262C"/>
    <circle cx="120" cy="30" r="8" fill="#26262C"/>
  </g>

  <!-- Video Icon -->
  <g transform="translate(780, 550)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="10" y="10" width="100" height="60" rx="5" fill="#F3140C" opacity="0.3"/>
    <polygon points="45,25 45,55 70,40" fill="#F3140C"/>
  </g>

  <!-- Floating Elements -->
  <circle cx="100" cy="100" r="15" fill="#F3140C" opacity="0.3"/>
  <circle cx="900" cy="700" r="20" fill="#F3140C" opacity="0.3"/>
  <circle cx="850" cy="100" r="12" fill="#FF4D47" opacity="0.4"/>
  <circle cx="150" cy="650" r="18" fill="#FF4D47" opacity="0.4"/>

  <!-- WordPress Logo Hint -->
  <g transform="translate(820, 350)">
    <circle cx="30" cy="30" r="30" fill="#FFFFFF"/>
    <text x="30" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#F3140C">W</text>
  </g>

  <!-- Like Icon -->
  <g transform="translate(50, 350)">
    <path d="M30 15 C30 10 35 5 40 5 C43 5 45 7 47 10 C49 7 51 5 54 5 C59 5 64 10 64 15 C64 25 47 40 47 40 C47 40 30 25 30 15 Z" fill="#F3140C"/>
  </g>

  <!-- Star -->
  <g transform="translate(700, 200)">
    <polygon points="25,5 30,18 44,18 33,26 37,40 25,31 13,40 17,26 6,18 20,18" fill="#FFC107"/>
  </g>
</svg>
